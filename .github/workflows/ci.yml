name: CI

on:
  pull_request:
  push:
    branches: ['master']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Test
        run: yarn test --runInBand

      - name: Build
        run: yarn build

      - name: Smoke-test published package
        shell: bash
        run: |
          PACKAGE="$(npm pack --silent)"
          mkdir -p "$RUNNER_TEMP/jsvat-next-smoke"
          cd "$RUNNER_TEMP/jsvat-next-smoke"
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/$PACKAGE" --ignore-scripts --no-audit --no-fund

          node -e "const { checkVAT, belgium } = require('jsvat-next'); if (!checkVAT('BE1001686633', [belgium]).isValid) process.exit(1)"
          node --input-type=module -e "import { checkVAT, belgium } from 'jsvat-next'; if (!checkVAT('BE1001686633', [belgium]).isValid) process.exit(1)"
